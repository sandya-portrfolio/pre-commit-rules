name: Go CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.21', '1.22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: gofmt -l .
        continue-on-error: true

      - name: Vet
        run: go vet ./...
        continue-on-error: true

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
        continue-on-error: true

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -v ./...
